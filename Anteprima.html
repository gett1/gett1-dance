<script src="Assets/Character.js"></script><script>
const $=id=>document.getElementById(id);let playing=true,beat=0,last=performance.now(),rate=1,meterNumerator=4,meterDenominator=4,meterStart=0;
$('play').onclick=()=>{playing=!playing;$('play').textContent=playing?'Pause':'Play';};
$('clean').onclick=()=>document.body.classList.toggle('clean');
$('meter').onchange=()=>{
  [meterNumerator,meterDenominator]=$('meter').value.split('/').map(Number);
  meterStart=beat;
  $('signature').textContent=$('meter').value;
  $('beats').innerHTML=Array.from({length:meterNumerator},(_,index)=>'<i>'+(index+1)+'</i>').join('');
};
$('prev').onclick=()=>{$('preset').selectedIndex=($('preset').selectedIndex+11)%12;};
$('next').onclick=()=>{$('preset').selectedIndex=($('preset').selectedIndex+1)%12;};
document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>{rate=Number(b.dataset.rate);document.querySelectorAll('[data-rate]').forEach(x=>x.classList.toggle('active',x===b));});
$('overlay').onclick=()=>{const on=$('overlay').getAttribute('aria-pressed')!=='true';$('overlay').setAttribute('aria-pressed',String(on));$('overlay').querySelector('span').textContent=on?'HIDE MASCOT':'SHOW MASCOT';$('enabled').textContent=on?'ON':'OFF';};
$('size').oninput=()=>{const v=Number($('size').value);$('sizeOut').textContent=v+' %';document.querySelectorAll('#dialTicks line').forEach((tick,index)=>tick.classList.toggle('on',index/20<=(v-50)/110));$('knob').style.setProperty('--angle',(-135+270*(v-50)/110)+'deg');};
$('size').ondblclick=()=>{$('size').value=100;$('size').oninput();};$('size').oninput();
function tick(now){const dt=Math.max(0,Math.min((now-last)/1000,.15));last=now;let bpm=Number($('bpm').value);if(!Number.isFinite(bpm)||bpm<30)bpm=30;bpm=Math.min(300,bpm);if(playing)beat+=dt*bpm/60;$('cat').innerHTML=render(pose(beat*rate,$('preset').selectedIndex,playing));document.querySelectorAll('.beats i').forEach((x,i)=>x.classList.toggle('on',playing&&i===Math.floor((beat-meterStart)*meterDenominator/4)%meterNumerator));$('transport').textContent=playing?'HOST PLAYING':'HOST STOPPED';$('led').style.background=playing?'#acd4a0':'#bd9f9e';requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script>
